name: build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build Cyberpunk plugin (C++)
        shell: cmd
        working-directory: cyberpunk
        run: |
          powershell -ExecutionPolicy Bypass -File fetch_deps.ps1
          .\build.bat

      - name: Build Minecraft mod (Java)
        shell: cmd
        working-directory: minecraft
        run: .\gradlew.bat build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: minepunk-build
          path: |
            cyberpunk/build/MCPassthrough.dll
            minecraft/build/libs/*.jar
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Automated build ${{ github.run_number }}
          files: |
            cyberpunk/build/MCPassthrough.dll
            minecraft/build/libs/*.jar
          make_latest: 'true'
