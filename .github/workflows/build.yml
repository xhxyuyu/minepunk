name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build Cyberpunk plugin (C++)
        shell: cmd
        working-directory: cyberpunk
        run: |
          powershell -ExecutionPolicy Bypass -File fetch_deps.ps1
          .\build.bat

      - name: Build Minecraft mod (Java)
        shell: cmd
        working-directory: minecraft
        run: .\gradlew.bat build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minepunk-build
          path: |
            cyberpunk/build/MCPassthrough.dll
            minecraft/build/libs/*.jar
          if-no-files-found: error
